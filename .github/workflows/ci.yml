name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The recursion's mock tests, weekly (the job `recursion` below).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shielded_bitcoin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release --exclude halo2_proofs --exclude vesta-ecc -- -D warnings
      - run: cargo build --release --workspace
      # The variant's end-to-end test has its own job below.
      - run: cargo test --release --workspace -- --skip variant_a_cycle
      # The PostgreSQL store against a real database (ephemeral service above).
      - run: cargo test -p sb-indexer --release --test pg_store -- --ignored
        env:
          SB_TEST_PG: postgresql://postgres:postgres@localhost:5432/shielded_bitcoin
      # Poseidon constants re-derived independently of arkworks (paper profile)
      # and of halo2_poseidon (variant A).
      - run: python3 scripts/poseidon_params_check.py
      - run: python3 scripts/poseidon_params_check_a.py
      # Line coverage gate (test-support fake servers excluded). Live network
      # tests are included; a failing one does not abort the measurement.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: >-
          cargo llvm-cov --workspace --exclude sba-replay --exclude vesta-ecc --exclude halo2_proofs --release --ignore-run-fail
          --ignore-filename-regex 'chain/fake\.rs|variants/a-halo2/crates/sba-cli/|variants/a-halo2/crates/sba-replay/|experiments/'
          --fail-under-lines 90
          -- --include-ignored --skip variant_a_cycle
        env:
          SB_TEST_PG: postgresql://postgres:postgres@localhost:5432/shielded_bitcoin
  # Variant A end to end through `sb` on both carriers (docs/VARIANT-A.md §6.7):
  # its own job, so the paper's job keeps its length; the variant's crates
  # are unit-tested and measured in the job above, its CLI only here.
  variant-a:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p sb-cli --test variant_a_e2e
  # The static binary (README "Static build") must keep building.
  static:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # the package lists first: the runner image's are often stale
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p sb-cli --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: file target/x86_64-unknown-linux-musl/release/sb && target/x86_64-unknown-linux-musl/release/sb --version
  # The accumulated replay proof's recursion end to end in the mock prover
  # (docs/REPLAY-PROOF-A.md §3.3–3.8), weekly and on demand: the `#[ignore]`d
  # tests of `sba-replay` that fit a hosted runner (k ≤ 17, minutes each) —
  # one transfer proof verified in both circuits, the group and field sides
  # over real T_q/T_p proofs, the batch relation inside a step, a block of
  # two transfers, the split transcript's step with its negative link check.
  # The k = 18 tests (the closed loop, the fragment prover, the chain) need
  # about 15 GB and an hour: they run on the server, with figures in the study.
  recursion:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test -p sba-replay --release -- --ignored --nocapture --test-threads 1
          zs_and_us_of_one_point
          prove_the_field_side
          the_field_side_of_a_tq_proof_verifies_in_circuit
          the_field_side_of_a_tp_proof_with_an_opened_claim
          the_p_group_side_of_a_tq_proof_verifies_in_circuit
          the_q_group_side_of_a_tp_proof_verifies_in_circuit
          one_transfer_proof_verified_recursively
          a_replayed_blocks_relation_inside_the_step
          a_block_with_two_transfers_in_one_step
          two_transfers_both_sides_split
