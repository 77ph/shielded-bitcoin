[package]
name = "sba-indexer"
description = "Shielded Bitcoin variant A: deterministic replay of family-A envelopes from the Bitcoin chain (docs/PROFILE-A.md §9–§11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sba-primitives.workspace = true
sba-core.workspace = true
sba-circuit.workspace = true
sb-common.workspace = true
bitcoin.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
log.workspace = true
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
ff = { workspace = true, optional = true }

[features]
# the test world (`testing.rs`) for other crates' tests and experiments
testing = ["dep:rand", "dep:rand_chacha", "dep:ff"]

[dev-dependencies]
# the crate's own tests use the test world
sba-indexer = { path = ".", features = ["testing"] }
rand.workspace = true
rand_chacha.workspace = true
ff.workspace = true
