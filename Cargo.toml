[workspace]
resolver = "3"
members = [
    "crates/sb-primitives",
    "crates/sb-core",
    "crates/sb-common",
    "crates/sb-circuit",
    "crates/sb-indexer",
    "crates/sb-wallet",
    "crates/sb-ceremony",
    "crates/sb-cli",
    # variant A (docs/VARIANT-A.md §6): Halo 2 over Pasta
    "variants/a-halo2/crates/sba-primitives",
    "variants/a-halo2/crates/sba-core",
    "variants/a-halo2/crates/sba-circuit",
    "variants/a-halo2/crates/sba-indexer",
    "variants/a-halo2/crates/sba-wallet",
    "variants/a-halo2/crates/sba-cli",
    "variants/a-halo2/crates/sba-replay",
    # the vendored halo2_proofs (the [patch] below) and the Vesta chip port
    # sba-replay builds on; upstream code, excluded from clippy in CI
    "experiments/halo2_proofs-patched",
    "experiments/vesta-ecc",
]
# standalone measurements with their own dependencies (experiments/README.md)
exclude = ["experiments/twochain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/77ph/shielded-bitcoin"

[workspace.dependencies]
sb-primitives = { path = "crates/sb-primitives" }
sb-core = { path = "crates/sb-core" }
sb-common = { path = "crates/sb-common" }
sb-circuit = { path = "crates/sb-circuit" }
sb-indexer = { path = "crates/sb-indexer" }
sb-wallet = { path = "crates/sb-wallet" }
sb-ceremony = { path = "crates/sb-ceremony" }
sba-primitives = { path = "variants/a-halo2/crates/sba-primitives" }
sba-core = { path = "variants/a-halo2/crates/sba-core" }
sba-circuit = { path = "variants/a-halo2/crates/sba-circuit" }
sba-indexer = { path = "variants/a-halo2/crates/sba-indexer" }
sba-wallet = { path = "variants/a-halo2/crates/sba-wallet" }
sba-cli = { path = "variants/a-halo2/crates/sba-cli" }
sba-replay = { path = "variants/a-halo2/crates/sba-replay" }
# the Vesta port of halo2_gadgets' ECC chip (experiments/README.md), used by sba-replay
vesta-ecc = { path = "experiments/vesta-ecc" }

# variant A: Halo 2 over the Pasta curves
halo2_proofs = "0.3"
halo2_gadgets = "0.5"
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"

# arkworks
ark-ff = { version = "0.5", features = ["parallel"] }
ark-ec = { version = "0.5", features = ["parallel"] }
ark-std = "0.5"
ark-serialize = "0.5"
ark-bls12-381 = "0.5"
ark-ed-on-bls12-381 = { version = "0.5", features = ["r1cs"] }
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-groth16 = { version = "0.5", features = ["parallel"] }
ark-poly = { version = "0.5", features = ["parallel"] }
rayon = "1"
ark-snark = "0.5"
ark-crypto-primitives = { version = "0.5", default-features = false, features = ["sponge", "crh", "r1cs"] }

# bitcoin
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }

# crypto
sha2 = "0.10"
blake2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rpassword = "7"
bech32 = "0.11"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# http
ureq = { version = "2", features = ["json", "socks-proxy"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rcgen = "0.13"

# database
postgres = "0.19"

# misc
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"

[profile.release]
overflow-checks = true

# arkworks is unusable unoptimised; keep `cargo test` fast.
[profile.dev.package."*"]
opt-level = 3

# halo2_proofs 0.3.5 with read-only accessors and the accumulation step's
# extra openings (experiments/halo2_proofs-patched/Cargo.toml); the prover and
# verifier are otherwise unchanged, so every crate's proofs are the same.
[patch.crates-io]
halo2_proofs = { path = "experiments/halo2_proofs-patched" }
