[package]
name = "cycle"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-mnt4-753 = { version = "0.5", features = ["r1cs"] }
ark-mnt6-753 = { version = "0.5", features = ["r1cs"] }
ark-groth16 = { version = "0.5", features = ["r1cs", "parallel"] }
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-ff = "0.5"
ark-ec = "0.5"
ark-std = "0.5"
ark-snark = "0.5"
ark-crypto-primitives = { version = "0.5", default-features = false, features = ["snark", "r1cs"] }

[workspace]
